  <body>
    <script>
      // Apply stored color mode before React hydrates to prevent a flash of the
      // default theme. Keep in sync with logi8173_color_mode in src/lib/color-mode.ts.
      (function () {
        try {
          var stored = localStorage.getItem("logi8173_color_mode");
          var mode =
            stored === "dark" || stored === "combat" ? stored : "light";
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
